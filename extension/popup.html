<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BatchMan</title>
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      color: #1e293b;
      margin: 0;
      padding: 12px;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status {
      background: #f1f5f9;
      border-radius: 4px;
      padding: 8px 10px;
      margin-bottom: 10px;
      color: #475569;
    }
    .status strong {
      color: #1e293b;
    }
    a.settings-link {
      display: block;
      text-align: center;
      padding: 7px;
      background: #2563eb;
      color: white;
      border-radius: 4px;
      text-decoration: none;
      font-size: 12px;
    }
    a.settings-link:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <h1>🦇 BatchMan</h1>
  <div class="status" id="status">Loading knowledge base...</div>
  <a class="settings-link" id="settings-link" href="#">⚙ Settings</a>
  <script src="popup.js"></script>
</body>
</html>
