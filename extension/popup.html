<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BatchMan</title>
  <style>
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      color: #1e293b;
      margin: 0;
      padding: 12px;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 12px;
    }
    .status {
      background: #f1f5f9;
      border-radius: 4px;
      padding: 7px 10px;
      color: #475569;
      margin-bottom: 8px;
    }
    .page-status {
      border-radius: 4px;
      padding: 8px 10px;
      margin-bottom: 10px;
      font-size: 13px;
    }
    .page-status--known {
      background: #f0fdf4;
      border-left: 3px solid #16a34a;
      color: #166534;
    }
    .page-status--unknown {
      background: #fff7ed;
      border-left: 3px solid #ea580c;
      color: #9a3412;
    }
    .page-status--neutral {
      background: #f1f5f9;
      color: #64748b;
    }
    a.settings-link {
      display: block;
      text-align: center;
      padding: 7px;
      background: #2563eb;
      color: white;
      border-radius: 4px;
      text-decoration: none;
      font-size: 12px;
    }
    a.settings-link:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <h1>🦇 BatchMan</h1>
  <div class="page-status page-status--neutral" id="page-status">Checking current page...</div>
  <div class="status" id="status">Loading knowledge base...</div>
  <a class="settings-link" id="settings-link" href="#">⚙ Settings</a>
  <script src="popup.js"></script>
</body>
</html>
